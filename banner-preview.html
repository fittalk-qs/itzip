<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>배너 미리보기</title>
<!-- 배너 메이커 안의 미리보기 창입니다. 사람이 직접 열 일은 없습니다.

     실제 라이브와 똑같은 banner.css / banner.js 를 그대로 씁니다. 메이커가 폼을 고칠 때마다
     postMessage 로 데이터만 밀어 넣습니다. 미리보기 전용으로 배너를 한 벌 더 그리지 않기
     때문에 "메이커에서는 되는데 라이브에서는 다르다" 가 생기지 않습니다. -->
<link rel="stylesheet" href="banner.css">
<style>
  html,body{background:#fff}
  /* 높이를 여기서 정하지 않습니다. 라이브에서도 배너 높이는 글 내용이 정하고 (그래서
     banner.js 의 fit() 이 iframe 을 거기에 맞춥니다), 모바일 높이는 banner.css 가 잡습니다.
     예전에 여기서 #itzip-banner 에 height 를 걸었더니 id 선택자가 .acb 를 이겨서
     모바일 레이아웃이 납작하게 눌렸습니다. */
</style>
<div id="itzip-banner"></div>
<script>window.ITZIP_BANNER_MANUAL = 1;</script>
<script src="banner.js"></script>
<script>
  // 부모(메이커)가 보내 주는 데이터로만 그립니다. banner.json 은 읽지 않습니다.
  addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'itzipBannerData') return;
    try { window.itzipBanner.render(d.data); } catch (err) { console.warn('[preview]', err); }
  });
  // 창이 준비됐다고 알려 첫 그림을 받습니다.
  try { parent.postMessage({ type: 'itzipBannerReady' }, '*'); } catch (e) {}
</script>
