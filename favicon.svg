<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 핏톡의 마법도구 파비콘.
       마스코트가 쓴 마법사 모자(보라)에 박힌 별(노랑) 그대로입니다.
       탭에서는 16px 로 줄어들기 때문에 테두리선을 넣지 않았습니다. 얇은 선은 그 크기에서
       뭉개져서 별이 지저분해 보입니다. 보라 바탕 + 노랑 별의 명암 차이만으로 충분합니다. -->
  <rect width="32" height="32" rx="8" fill="#7c5cff"/>
  <path d="M16 5 18.6 13.4 27 16 18.6 18.6 16 27 13.4 18.6 5 16 13.4 13.4z" fill="#ffce5c"/>
  <path d="M25 3.5 25.9 6.1 28.5 7 25.9 7.9 25 10.5 24.1 7.9 21.5 7 24.1 6.1z" fill="#fff" opacity=".85"/>
</svg>
