<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>잇집 슬라이드 배너 메이커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Pretendard','Malgun Gothic',sans-serif;color:#1b2340;background:#f4f5f8;
  display:flex;height:100vh;overflow:hidden}
#panel{width:380px;flex:0 0 380px;background:#fff;border-right:1px solid #e3e6ee;padding:18px;overflow-y:auto}
#right{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{flex:0 0 auto;padding:10px 14px;background:#fff;border-bottom:1px solid #e3e6ee;
  display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#bar .sp{flex:1}
#bar .tip{font-size:11.5px;color:#9aa1b4}
#stage{flex:1;overflow:auto;padding:16px;background:#eceef4}
/* 미리보기는 진짜 폭(PC 1200 / 태블릿 834 / 모바일 390)으로 그린 뒤 통째로 축소합니다.
   iframe 을 창에 맞춰 좁히면 PC 를 보는데 모바일 레이아웃이 나옵니다. 큐샵이 캔버스를
   통째로 확대·축소하는 것과 같은 방식입니다. */
#pvwrap{margin:0 auto;overflow:hidden}
#pv{border:0;background:#fff;display:block;transform-origin:top left}

.back{display:inline-block;font-size:12px;color:#7a8194;text-decoration:none;margin-bottom:10px}
.back:hover{color:#3700ff}
h1{font-size:16px;margin:0 0 4px}
.sub{font-size:12px;color:#7a8194;margin:0 0 14px;line-height:1.6}
fieldset{border:1px solid #e8eaf2;border-radius:10px;padding:12px;margin:0 0 12px}
legend{font-size:12px;font-weight:800;color:#3b4256;padding:0 6px;display:flex;align-items:center;gap:6px}
.row{margin:9px 0}
.row:first-child{margin-top:2px}
.row>label{display:block;font-size:11.5px;color:#7a8194;margin-bottom:4px;font-weight:600}
.row .hint{font-size:11px;color:#aab0c0;font-weight:400}
input[type=text],input[type=number],textarea,select{width:100%;padding:7px 8px;border:1px solid #dfe3ee;
  border-radius:8px;font:inherit;font-size:12.5px;background:#fff;color:#2b3245}
textarea{resize:vertical;line-height:1.55}
input[type=text].url,textarea.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid #dfe3ee;background:#fff;
  padding:6px 10px;font-size:12px;color:#3b4256}
button:hover{border-color:#c9c2ff;color:#3700ff}
button.on{background:#1b2340;border-color:#1b2340;color:#fff}
button.on:hover{color:#fff}
button.go{background:#3700ff;border-color:#3700ff;color:#fff;font-weight:700;padding:9px 13px;font-size:12.5px}
button.go:hover{color:#fff;opacity:.92}
button.done{background:#eef0ff;border-color:#3700ff;color:#3700ff}
button.go.done{background:#1b2340;border-color:#1b2340;color:#fff}
button.x{border-color:#f0d5d5;color:#c0392b;padding:4px 8px;font-size:11px}
button.x:hover{background:#fff6f6;border-color:#e6b8b8;color:#c0392b}
button.add{width:100%;border-style:dashed;color:#7a8194;font-size:11.5px;padding:7px}
.bar2{display:flex;gap:6px;align-items:center;margin-top:9px;flex-wrap:wrap}

/* 패널 탭 */
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 12px}
.tabs button{padding:6px 9px;font-size:11.5px;font-weight:700}
.tabs button .lb{font-weight:500;opacity:.72;margin-left:4px}

/* 아이콘 줄 / 평면 한 덩어리 */
.item{border:1px solid #eef0f6;border-radius:9px;padding:9px;margin:0 0 8px;background:#fbfbfd}
.item .top{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.item .top .t{flex:1;font-size:11px;font-weight:700;color:#7a8194}
.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}

/* 이미지 주소 옆 미리보기 — 주소가 맞는지 눈으로 바로 확인 */
.imgrow{display:flex;gap:7px;align-items:flex-start}
.imgrow input{flex:1;min-width:0}
.imgrow .th{flex:0 0 46px;height:32px;border-radius:5px;border:1px solid #e3e6ee;background:#f0f2f8 center/cover no-repeat}
.imgrow .th.bad{background-image:none;border-color:#f0d5d5}

.out{width:100%;height:120px;background:#fbfbfd}
.note{font-size:11.5px;color:#7a8194;line-height:1.7;margin:9px 0 0}
.note a{color:#3700ff}
.note b{color:#3b4256}
.src{font-size:11px;color:#9aa1b4;margin:0 0 12px;padding:7px 9px;background:#f7f8fc;border-radius:7px;line-height:1.6}
.src.warn{background:#fff8ef;color:#9a6a2a}
</style>

<div id=panel>
  <a class=back href="./">← 핏톡의 마법도구</a>
  <h1>슬라이드 배너 메이커</h1>
  <p class=sub>메인홈 맨 위 배너의 내용을 바꿉니다. 오른쪽 미리보기는 실제 홈페이지와 같은 코드로 그려집니다.</p>
  <p class=src id=src>불러오는 중…</p>

  <fieldset id=top><legend>공통</legend>
    <div class=row><label>현장명 <span class=hint>패널마다 작게 들어갑니다</span></label>
      <input type=text data-t=site placeholder="북오산 자이 드포레"></div>
    <div class=row><label>상품 링크 <span class=hint>버튼을 눌렀을 때 가는 곳</span></label>
      <input type=text class=url data-t=link placeholder="https://www.itzip.net/products/766260"></div>
    <div class=two>
      <div class=row><label>버튼 글자</label><input type=text data-t=cta placeholder="더 보기"></div>
      <div class=row><label>자동 전환 <span class=hint>초 · 0이면 멈춤</span></label>
        <input type=number data-t=duration min=0 max=60 step=1></div>
    </div>
  </fieldset>

  <div class=tabs id=tabs></div>
  <div id=pedit></div>

  <fieldset><legend>붙여넣을 내용 (banner.json)</legend>
    <textarea id=out class="out mono" readonly spellcheck=false></textarea>
    <div class=bar2><button class=go id=copy style="flex:1">전체 복사</button>
      <button id=reload>라이브 다시 불러오기</button></div>
    <p class=note>
      <b>올리는 법</b><br>
      1. 위 <b>전체 복사</b><br>
      2. <a href="https://github.com/fittalk-qs/itzip/edit/main/banner.json" target=_blank rel=noopener>깃허브에서 banner.json 열기</a><br>
      3. 안에 있던 것 <b>전부 지우고</b> 붙여넣기 → 초록 <b>Commit changes</b><br>
      4. 홈페이지에 반영되기까지 최대 10분<br>
      큐샵은 건드리지 않습니다.
    </p>
  </fieldset>
</div>

<div id=right>
  <div id=bar>
    <button class="on" data-w=0>PC</button>
    <button data-w=834>태블릿</button>
    <button data-w=390>모바일</button>
    <span class=sp></span>
    <button id=auto>자동 전환 미리보기</button>
    <span class=tip>미리보기에서 띠를 눌러 볼 수 있습니다</span>
  </div>
  <div id=stage><div id=pvwrap><iframe id=pv src="banner-preview.html" title="배너 미리보기"></iframe></div></div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var PV = $('pv'), OUT = $('out'), TABS = $('tabs'), PEDIT = $('pedit');

  // 아이콘 목록. banner.js 의 ICONS 와 이름이 짝입니다. 거기 없는 이름을 고르면
  // 아이콘 없이 글자만 나옵니다.
  var ICONS = [['sofa','소파·인테리어'],['bulb','전구·아이디어'],['train','교통·전철'],
    ['book','학교·교육'],['tree','자연·공원'],['home','단지·주택'],['shop','상권·편의'],
    ['car','주차·도로'],['map','입지·지도'],['clock','시간·일정'],['won','금액·조건'],['star','프리미엄']];

  // 라이브 banner.json 을 못 읽을 때 시작할 빈 틀. 여기에 예전 현장 내용을 박아 두면
  // 그게 라이브인 줄 알고 그대로 올리는 사고가 나서, 일부러 비워 둡니다.
  function blank() {
    return { site:'', link:'', cta:'더 보기', duration:5000, panels:[
      { label:'핵심 포인트', title:'', sub:'', bg:'', chips:[] },
      { label:'인테리어', title:'', bg:'', feats:[] },
      { label:'프리미엄', title:'', bg:'', feats:[], chips:[] },
      { label:'평면', title:'', bg:'', plans:[] }
    ] };
  }

  var D = blank(), cur = 0, ready = false, pending = null, timer = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c];
    });
  }
  function arr(v) { return Object.prototype.toString.call(v) === '[object Array]' ? v : []; }
  function no(i) { return (i + 1 < 10 ? '0' : '') + (i + 1); }

  // ── 미리보기로 밀어 넣기 ────────────────────────────────────────────
  // 글자를 칠 때마다 배너를 다시 그리면 눈이 피곤해서 조금 모았다 보냅니다.
  // 미리보기에서는 자동 전환을 꺼 둡니다. 켜 두면 고치는 도중에 5초마다 다른 패널로
  // 넘어가 버려서, 지금 손대는 패널이 눈앞에서 사라집니다. 내보낼 json 에는 원래 값이
  // 그대로 들어가고, 여기 버튼은 실제로 어떻게 넘어가는지 볼 때만 켭니다.
  var pvAuto = false;
  function push() {
    var d = { site:D.site, link:D.link, cta:D.cta,
      duration: pvAuto ? D.duration : 0, panels:D.panels, open:cur };
    if (!ready) { pending = d; return; }
    try { PV.contentWindow.postMessage({ type:'itzipBannerData', data:d }, '*'); } catch (e) {}
  }
  addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'itzipBannerReady') return;
    ready = true;
    push();
    pending = null;
  });

  function sync() {
    OUT.value = json();
    clearTimeout(timer);
    timer = setTimeout(push, 260);
  }

  // 내보낼 json. 비어 있는 칸은 빼서 파일을 짧게 유지합니다. 나중에 사람이 눈으로 볼 때도
  // 안 쓰는 항목이 안 보이는 편이 낫습니다.
  function json() {
    var o = { site:D.site || '', link:D.link || '', cta:D.cta || '더 보기',
      duration: typeof D.duration === 'number' ? D.duration : 5000, panels: [] };
    D.panels.forEach(function (p) {
      var q = { label: p.label || '' };
      if (p.title) q.title = p.title;
      if (p.sub) q.sub = p.sub;
      if (p.bg) q.bg = p.bg;
      var f = arr(p.feats).filter(function (x) { return x && x.text; });
      if (f.length) q.feats = f.map(function (x) { return { icon:x.icon || '', text:x.text }; });
      var pl = arr(p.plans).filter(function (x) { return x && x.name; });
      if (pl.length) q.plans = pl.map(function (x) {
        return { name:x.name, desc:x.desc || '', img:x.img || '', thumb:x.thumb || '' };
      });
      var c = arr(p.chips).filter(function (x) { return x; });
      if (c.length) q.chips = c;
      if (p.link) q.link = p.link;
      o.panels.push(q);
    });
    return JSON.stringify(o, null, 2);
  }

  // ── 폼 그리기 ───────────────────────────────────────────────────────
  function drawTabs() {
    var h = '';
    D.panels.forEach(function (p, i) {
      h += '<button data-tab="' + i + '"' + (i === cur ? ' class=on' : '') + '>' + no(i) +
        '<span class=lb>' + esc(p.label || '이름 없음') + '</span></button>';
    });
    if (D.panels.length < 6) h += '<button data-add-panel title="패널 추가">＋</button>';
    TABS.innerHTML = h;
  }

  function imgRow(label, hint, key, val, idx, kind) {
    var a = kind === 'p' ? 'data-p="' + key + '"' : 'data-' + kind + '="' + key + '" data-i="' + idx + '"';
    return '<div class=row><label>' + label + (hint ? ' <span class=hint>' + hint + '</span>' : '') + '</label>' +
      '<div class=imgrow><input type=text class=url ' + a + ' value="' + esc(val || '') +
      '" placeholder="https://cdn.qshop.ai/…"><i class="th' + (val ? '' : ' bad') + '"' +
      (val ? ' style="background-image:url(' + esc(val) + ')"' : '') + '></i></div></div>';
  }

  function drawPanel() {
    var p = D.panels[cur];
    if (!p) { PEDIT.innerHTML = ''; return; }
    var h = '<fieldset><legend>' + no(cur) + ' 패널</legend>';

    h += '<div class=row><label>띠 글자 <span class=hint>접혔을 때 세로로 보이는 이름</span></label>' +
      '<input type=text data-p=label value="' + esc(p.label || '') + '" placeholder="핵심 포인트"></div>';
    h += '<div class=row><label>제목 <span class=hint>엔터로 줄바꿈</span></label>' +
      '<textarea data-p=title rows=2 placeholder="25평 4억대!">' + esc(p.title || '') + '</textarea></div>';
    h += '<div class=row><label>문구 <span class=hint>엔터로 줄바꿈 · 비워도 됩니다</span></label>' +
      '<textarea data-p=sub rows=2>' + esc(p.sub || '') + '</textarea></div>';
    h += imgRow('배경 사진 주소', '큐샵에 올린 이미지 주소', 'bg', p.bg, 0, 'p');

    // 아이콘 줄
    h += '<div class=row><label>아이콘 줄 <span class=hint>비우면 안 나옵니다</span></label>';
    arr(p.feats).forEach(function (f, i) {
      h += '<div class=item><div class=top><span class=t>' + (i + 1) + '번째 줄</span>' +
        '<button class=x data-del-feat="' + i + '">삭제</button></div>' +
        '<div class=row><select data-f=icon data-i="' + i + '">' +
        '<option value="">아이콘 없음</option>' +
        ICONS.map(function (ic) {
          return '<option value="' + ic[0] + '"' + (f.icon === ic[0] ? ' selected' : '') + '>' + ic[1] + '</option>';
        }).join('') + '</select></div>' +
        '<div class=row><textarea data-f=text data-i="' + i + '" rows=2 placeholder="엔터로 줄바꿈">' +
        esc(f.text || '') + '</textarea></div></div>';
    });
    h += '<button class=add data-add-feat>＋ 아이콘 줄 추가</button></div>';

    // 평면
    h += '<div class=row><label>평면 <span class=hint>비우면 안 나옵니다</span></label>';
    arr(p.plans).forEach(function (t, i) {
      h += '<div class=item><div class=top><span class=t>' + (i + 1) + '번째 평면</span>' +
        '<button class=x data-del-plan="' + i + '">삭제</button></div>' +
        '<div class=two><div class=row><label>이름</label>' +
        '<input type=text data-pl=name data-i="' + i + '" value="' + esc(t.name || '') + '" placeholder="59m²B"></div>' +
        '<div class=row><label>설명 <span class=hint>선택</span></label>' +
        '<input type=text data-pl=desc data-i="' + i + '" value="' + esc(t.desc || '') + '"></div></div>' +
        imgRow('썸네일 <span class=hint>작은 칸</span>', '', 'thumb', t.thumb, i, 'pl') +
        imgRow('눌렀을 때 배경', '', 'img', t.img, i, 'pl') +
        '</div>';
    });
    h += '<button class=add data-add-plan>＋ 평면 추가</button></div>';

    h += '<div class=row><label>칩 <span class=hint>한 줄에 하나씩 · 비우면 안 나옵니다</span></label>' +
      '<textarea data-p=chips rows=3 placeholder="계약금 10%&#10;2029.10 입주예정">' +
      esc(arr(p.chips).join('\n')) + '</textarea></div>';

    h += '<div class=row><label>이 패널만 다른 링크 <span class=hint>비우면 공통 링크</span></label>' +
      '<input type=text class=url data-p=link value="' + esc(p.link || '') + '"></div>';

    if (D.panels.length > 2) h += '<div class=bar2><button class=x data-del-panel>이 패널 삭제</button></div>';
    h += '</fieldset>';
    PEDIT.innerHTML = h;
  }

  function drawAll() { drawTabs(); drawPanel(); sync(); }

  // ── 입력 받기 ───────────────────────────────────────────────────────
  // 글자 칸은 다시 그리지 않고 값만 고칩니다. 다시 그리면 치던 칸에서 커서가 튀어나갑니다.
  function onInput(e) {
    var el = e.target, p = D.panels[cur], k;
    if ((k = el.getAttribute('data-t'))) {
      D[k] = k === 'duration' ? Math.max(0, (parseFloat(el.value) || 0)) * 1000 : el.value;
    } else if ((k = el.getAttribute('data-p'))) {
      if (k === 'chips') p.chips = el.value.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
      else { p[k] = el.value; if (k === 'label') drawTabs(); }
    } else if ((k = el.getAttribute('data-f'))) {
      p.feats[+el.getAttribute('data-i')][k] = el.value;
    } else if ((k = el.getAttribute('data-pl'))) {
      p.plans[+el.getAttribute('data-i')][k] = el.value;
    } else return;

    // 이미지 칸이면 옆 미리보기도 같이
    var th = el.parentNode && el.parentNode.className === 'imgrow' ? el.parentNode.querySelector('.th') : null;
    if (th) {
      th.style.backgroundImage = el.value ? 'url(' + el.value + ')' : '';
      th.className = 'th' + (el.value ? '' : ' bad');
    }
    sync();
  }
  PEDIT.addEventListener('input', onInput);
  PEDIT.addEventListener('change', onInput);   // select 대비
  $('top').addEventListener('input', onInput);

  PEDIT.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    var p = D.panels[cur], v;
    if (b.hasAttribute('data-add-feat')) { p.feats = arr(p.feats); p.feats.push({ icon:'', text:'' }); }
    else if ((v = b.getAttribute('data-del-feat')) !== null) p.feats.splice(+v, 1);
    else if (b.hasAttribute('data-add-plan')) { p.plans = arr(p.plans); p.plans.push({ name:'', desc:'', img:'', thumb:'' }); }
    else if ((v = b.getAttribute('data-del-plan')) !== null) p.plans.splice(+v, 1);
    else if (b.hasAttribute('data-del-panel')) {
      if (!confirm(no(cur) + ' 패널을 지울까요?')) return;
      D.panels.splice(cur, 1);
      cur = Math.min(cur, D.panels.length - 1);
      drawAll(); return;
    } else return;
    drawPanel(); sync();
  });

  TABS.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    if (b.hasAttribute('data-add-panel')) {
      D.panels.push({ label:'새 패널', title:'', sub:'', bg:'', chips:[] });
      cur = D.panels.length - 1;
    } else {
      var t = b.getAttribute('data-tab');
      if (t === null) return;
      cur = +t;
    }
    drawAll();
  });

  // ── 화면 폭 ─────────────────────────────────────────────────────────
  // 진짜 폭으로 그린 뒤 창에 맞게 축소합니다. 모바일은 세로로 길어져서 높이를 더 줍니다.
  var PW = 1200, PH = 700;
  function fitPv() {
    var avail = $('stage').clientWidth - 32;
    var s = Math.min(1, avail / PW);
    PV.style.width = PW + 'px';
    PV.style.height = PH + 'px';
    PV.style.transform = 'scale(' + s + ')';
    var w = $('pvwrap');
    w.style.width = Math.round(PW * s) + 'px';
    w.style.height = Math.round(PH * s) + 'px';
  }
  $('bar').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b || !b.hasAttribute('data-w')) return;
    [].forEach.call(this.querySelectorAll('button[data-w]'), function (x) { x.classList.toggle('on', x === b); });
    var w = +b.getAttribute('data-w');
    PW = w || 1200;
    PH = w && w <= 760 ? 820 : 700;
    fitPv();
  });
  addEventListener('resize', fitPv);
  fitPv();

  $('auto').onclick = function () {
    pvAuto = !pvAuto;
    this.classList.toggle('on', pvAuto);
    push();
  };

  // ── 복사 ────────────────────────────────────────────────────────────
  $('copy').onclick = function () {
    var btn = this, text = OUT.value;
    function ok() {
      btn.textContent = '복사했습니다'; btn.classList.add('done');
      setTimeout(function () { btn.textContent = '전체 복사'; btn.classList.remove('done'); }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, function () { OUT.select(); document.execCommand('copy'); ok(); });
    } else { OUT.select(); document.execCommand('copy'); ok(); }
  };

  // ── 지금 올라가 있는 내용 불러오기 ──────────────────────────────────
  function load(quiet) {
    var s = $('src');
    s.className = 'src'; s.textContent = '불러오는 중…';
    fetch('banner.json?v=' + Date.now()).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (d) {
      D = {
        site: d.site || '', link: d.link || '', cta: d.cta || '더 보기',
        duration: typeof d.duration === 'number' ? d.duration : 5000,
        panels: arr(d.panels).map(function (p) {
          return { label:p.label || '', title:p.title || '', sub:p.sub || '', bg:p.bg || '',
            feats: arr(p.feats).slice(), plans: arr(p.plans).slice(), chips: arr(p.chips).slice(),
            link: p.link || '' };
        })
      };
      if (!D.panels.length) D.panels = blank().panels;
      cur = Math.min(cur, D.panels.length - 1);
      fillTop();
      s.textContent = '지금 홈페이지에 올라가 있는 내용을 불러왔습니다. 고친 뒤 아래에서 복사하세요.';
      drawAll();
    }).catch(function (e) {
      // 파일을 직접 열었을 때(file://)는 브라우저가 fetch 를 막습니다. 깃허브 주소로 열면 됩니다.
      s.className = 'src warn';
      s.innerHTML = '지금 올라가 있는 내용을 못 읽어서 <b>빈 틀</b>로 시작합니다. ' +
        '(' + esc(String(e.message || e)) + ')<br>내용을 이어서 고치려면 ' +
        '<a href="https://fittalk-qs.github.io/itzip/banner-maker.html">깃허브 주소로 열어</a> 주세요.';
      if (!quiet) { D = blank(); fillTop(); drawAll(); }
    });
  }
  function fillTop() {
    var t = $('top');
    t.querySelector('[data-t=site]').value = D.site || '';
    t.querySelector('[data-t=link]').value = D.link || '';
    t.querySelector('[data-t=cta]').value = D.cta || '더 보기';
    t.querySelector('[data-t=duration]').value = (D.duration || 0) / 1000;
  }
  $('reload').onclick = function () {
    if (!confirm('지금 고치던 내용은 사라집니다. 다시 불러올까요?')) return;
    load(false);
  };

  fillTop(); drawAll(); load(false);
})();
</script>
